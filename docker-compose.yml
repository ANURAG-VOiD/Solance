# ---------------------------------------------------------------------------
# Solance full-stack deployment (Postgres + Rust/Axum backend + Next.js front).
#
# Brings up a reproducible local/staging stack:
#   docker compose up --build
#
# Configuration is supplied via a root `.env` file (copy `.env.example`).
# All secrets (POSTGRES_PASSWORD, JWT_SECRET, etc.) are REQUIRED — the stack
# will refuse to start if any are missing.
#
# NOTE: For dev that only needs Postgres (running backend/frontend natively),
# the lightweight `infrastructure/docker-compose.yml` still exists and is
# unchanged. This file is the complete containerised stack.
# ---------------------------------------------------------------------------

services:
  # --- PostgreSQL ---------------------------------------------------------
  # Port not exposed — backend reaches DB over the internal compose network
  postgres:
    image: postgres:16.3
    container_name: solance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-solance}
    volumes:
      # Named volume so data survives `docker compose down` (use `down -v` to wipe).
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Gate dependents on readiness, not just container start, so the backend
      # never races ahead of an unaccepting database.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-solance}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Backend (Rust / Axum) ---------------------------------------------
  backend:
    build:
      context: ./backend
    container_name: solance-backend
    restart: unless-stopped
    depends_on:
      postgres:
        # Wait until Postgres passes its healthcheck before starting.
        condition: service_healthy
    environment:
      PORT: ${BACKEND_PORT:-8080}
      # Connect over the compose network using the service name `postgres`.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-solance}
      # MUST be overridden with a strong secret (>= 32 chars). The backend
      # panics at startup if this is missing or too short.
      JWT_SECRET: ${JWT_SECRET}
      # CORS allow-origin — must match the browser origin of the frontend.
      FRONTEND_URL: ${FRONTEND_URL}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    # Migrations run automatically on startup (sqlx `migrate!` embedded in the
    # binary), so no separate migration step is required.

  # --- Frontend (Next.js) -------------------------------------------------
  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_* are inlined at BUILD time. NEXT_PUBLIC_API_URL must be
        # the URL the *browser* uses to reach the backend (e.g. the public API
        # domain in staging/production) — NOT the internal `backend` service
        # name. The build will fail if this contains "localhost" and
        # NODE_ENV=production.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SOLANA_RPC_URL: ${NEXT_PUBLIC_SOLANA_RPC_URL:-https://api.devnet.solana.com}
    container_name: solance-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  postgres_data:
